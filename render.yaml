# render.yaml — Render deployment config
services:
  - type: web
    name: cot-tracker
    env: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: ALLOWED_ORIGIN
        value: https://cot-tracker.onrender.com
      - key: JWT_SECRET
        generateValue: true        # Render auto-generates a secure random value
      - key: APP_PASSWORD
        sync: false                # You set this manually in Render dashboard
      - key: DATABASE_URL
        fromDatabase:
          name: cot-tracker-db
          property: connectionString

databases:
  - name: cot-tracker-db
    plan: free